SDG_GOAL: >-
  Objectif 1 : Éliminer la pauvreté sous toutes ses formes et partout dans le monde
SDG_TARGET: >-
  Cible 1.1 : D’ici à 2030, éliminer complètement l’extrême pauvreté dans le monde entier (s’entend actuellement du fait de vivre avec moins de 1,25 $ (dollar américain) par jour)
SDG_INDICATOR: >-
  Indicateur 1.1.1 : Proportion de la population vivant au-dessous du seuil de pauvreté fixé au niveau international, par sexe, âge, situation dans l’emploi et lieu de résidence (zone urbaine/zone rurale)
