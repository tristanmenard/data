name: Commit changes

on:
  workflow_dispatch:

jobs:
  commit-changes:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Set environment variable
      run: echo "CHANGED=true" >> $GITHUB_ENV
    - name: Use the environment variable
      run: echo "The value of CHANGED is $CHANGED"
    - name: Set output parameter
      id: color-selector
      run: echo "SELECTED_COLOR=green" >> "$GITHUB_OUTPUT"
    - name: Get output parameter
      env:
        SELECTED_COLOR: ${{ steps.color-selector.outputs.SELECTED_COLOR }}
      run: echo "The selected color is $SELECTED_COLOR"
    - name: Get output parameter if it is green
      if: steps.color-selector.outputs.SELECTED_COLOR == 'green'
      run: echo "It was green!"
    - name: Get output parameter if it is red
      if: steps.color-selector.outputs.SELECTED_COLOR == 'red'
      run: echo "It was red!"
