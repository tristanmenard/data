name: Commit changes

on:
  workflow_dispatch:

jobs:
  commit-changes:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Check if there are any changes to files
      id: verify_diff
      run: |
        git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT
        echo $GITHUB_OUTPUT
    - name: Did any files change?
      run: |
        echo steps.verify.diff.outputs.changed
