name: Commit changes

on:
  workflow_dispatch:

jobs:
  commit-changes:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Set environment variable
      run: echo "CHANGED=true" >> $GITHUB_OUTPUT
    - name: Use the environment variable
      run: echo "The value of CHANGED is $CHANGED"
